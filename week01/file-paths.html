    <h1>File Path Activity</h1>
    <p>Fix the image tags below so that they each display the correct image.</p>

    <p>A temple image file in the images subfolder:</p>
    <img src="images/aba-nigeria-temple.jpeg" alt="The Aba Nigeria Temple">

    <p>A temple image file in the root images folder:</p>
    <img src="salt-lake-temple-small.jpg" alt="The Salt Lake Temple">

    <p>A temple image file with an absolute path:</p>
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b9/Anchorage_Alaska_Temple_by_artchase.jpg/500px-Anchorage_Alaska_Temple_by_artchase.jpg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" width="320" alt="The Anchorage Alaska Temple">
